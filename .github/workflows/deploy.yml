name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed for git-log timestamps

      - name: Build site
        run: |
          mkdir -p _site/traces
          cp index.html _site/
          # Copy trace files; index.json is generated below, not stored in repo
          for f in traces/*.json; do
            [ "$(basename "$f")" = "index.json" ] && continue
            cp "$f" _site/traces/
          done
          # Generate _site/traces/index.json from git history
          python3 - << 'PYEOF'
          import json, os, re, subprocess

          traces = []
          for fname in sorted(os.listdir('traces')):
              if not fname.endswith('.json') or fname == 'index.json':
                  continue
              path = f'traces/{fname}'
              result = subprocess.run(
                  ['git', 'log', '--follow', '--format=%aI %s', '-1', '--', path],
                  capture_output=True, text=True, check=True,
              )
              line = result.stdout.strip()
              if not line:
                  continue
              uploaded_at, _, subject = line.partition(' ')
              m = re.search(r'pipeline (\S+)', subject)
              pipeline_id = m.group(1) if m else ''
              traces.append({
                  'path': path,
                  'uploaded_at': uploaded_at,
                  'pipeline_id': pipeline_id,
              })

          traces.sort(key=lambda x: x['uploaded_at'], reverse=True)
          traces = traces[:50]

          out = '_site/traces/index.json'
          with open(out, 'w') as f:
              json.dump({'traces': traces}, f, indent=2)
          print(f'Generated {out} with {len(traces)} entries')
          PYEOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
