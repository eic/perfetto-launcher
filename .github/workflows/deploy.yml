name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site
        run: |
          mkdir -p _site/traces
          cp index.html _site/
          # Copy trace files; index.json is generated below, not stored in repo
          for f in traces/*.json; do
            [ "$(basename "$f")" = "index.json" ] && continue
            cp "$f" _site/traces/
          done
          # Generate _site/traces/index.json from numeric trace IDs
          python3 - << 'PYEOF'
          import json, os, re

          entries = []
          for fname in os.listdir('traces'):
              m = re.fullmatch(r'trace-(\d+)\.json', fname)
              if not m:
                  continue
              entries.append({
                  'id': int(m.group(1)),
                  'path': f'traces/{fname}',
                  'pipeline_id': m.group(1),
              })

          entries.sort(key=lambda x: x['id'], reverse=True)
          traces = [{'path': e['path'], 'pipeline_id': e['pipeline_id']} for e in entries]
          traces = traces[:50]

          out = '_site/traces/index.json'
          with open(out, 'w') as f:
              json.dump({'traces': traces}, f, indent=2)
          print(f'Generated {out} with {len(traces)} entries')
          PYEOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
