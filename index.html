<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfetto Trace Launcher</title>
  <style>
    body { font-family: sans-serif; max-width: 1100px; margin: 4em auto; padding: 1em; }
    h1 { font-size: 1.5em; }
    #status { font-size: 1.1em; margin: 1em 0; }
    .error { color: #c00; }
    .ok { color: #060; }
    table { border-collapse: collapse; width: 100%; margin-top: 1em; }
    th, td { text-align: left; padding: 0.4em 0.7em; border-bottom: 1px solid #ddd; }
    th { background: #f5f5f5; font-weight: 600; }
    a { color: #0969da; }
    tr:hover td { background: #f8f8f8; }
  </style>
</head>
<body>
  <h1>EIC Perfetto Trace Launcher</h1>
  <p id="status">Initializing&hellip;</p>
  <div id="listing" hidden></div>
  <script>
  (async () => {
    const status = document.getElementById('status');
    const listing = document.getElementById('listing');
    const params = new URLSearchParams(location.search);
    const trace = params.get('trace');
    const US_PER_SECOND = 1_000_000;
    const US_PER_MINUTE = 60 * US_PER_SECOND;
    const US_PER_HOUR = 60 * US_PER_MINUTE;

    function formatDuration(us) {
      if (!Number.isFinite(us) || us <= 0) return '0s';
      const totalSeconds = Math.round(us / US_PER_SECOND);
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      if (hours > 0) {
        if (minutes > 0) return `${hours}h${minutes}m`;
        return seconds > 0 ? `${hours}h${seconds}s` : `${hours}h`;
      }
      if (minutes > 0) return seconds > 0 ? `${minutes}m${seconds}s` : `${minutes}m`;
      return `${seconds}s`;
    }

    function formatCoreTime(us) {
      if (!Number.isFinite(us) || us <= 0) return '0 core-hours';
      const coreHours = us / US_PER_HOUR;
      if (coreHours >= 1) return `${coreHours.toFixed(coreHours >= 100 ? 0 : 1)} core-hours`;
      const coreMinutes = us / US_PER_MINUTE;
      return `${coreMinutes.toFixed(coreMinutes >= 10 ? 0 : 1)} core-minutes`;
    }

    function buildIntervals(events) {
      const intervals = [];
      const beginStacks = new Map();

      for (const e of events || []) {
        if (!e || typeof e !== 'object' || typeof e.name !== 'string') continue;
        if (e.name.startsWith('status:')) continue;
        if (!Number.isFinite(e.ts)) continue;

        if (e.ph === 'X' && Number.isFinite(e.dur) && e.dur >= 0) {
          const start = e.ts;
          const end = e.ts + e.dur;
          if (end >= start) intervals.push([start, end]);
          continue;
        }

        if (e.ph === 'B') {
          const key = `${e.pid ?? ''}:${e.tid ?? ''}:${e.name}`;
          if (!beginStacks.has(key)) beginStacks.set(key, []);
          beginStacks.get(key).push(e.ts);
          continue;
        }

        if (e.ph === 'E') {
          const key = `${e.pid ?? ''}:${e.tid ?? ''}:${e.name}`;
          const stack = beginStacks.get(key);
          if (!stack || stack.length === 0) continue;
          const start = stack.pop();
          if (e.ts >= start) intervals.push([start, e.ts]);
        }
      }
      return intervals;
    }

    function analyzeTrace(traceData) {
      const events = Array.isArray(traceData)
        ? traceData
        : Array.isArray(traceData?.traceEvents)
          ? traceData.traceEvents
          : [];
      const intervals = buildIntervals(events);
      if (intervals.length === 0) return null;

      let earliest = Infinity;
      let latest = -Infinity;
      let coreTime = 0;
      const points = [];
      for (const [start, end] of intervals) {
        if (start < earliest) earliest = start;
        if (end > latest) latest = end;
        coreTime += (end - start);
        points.push({ t: start, d: 1 });
        points.push({ t: end, d: -1 });
      }

      points.sort((a, b) => (a.t !== b.t ? (a.t - b.t) : (a.d - b.d)));
      let running = 0;
      let blockedOrQueued = 0;
      let prev = points[0].t;
      for (const p of points) {
        const dt = p.t - prev;
        if (dt > 0 && running <= 1) blockedOrQueued += dt;
        running += p.d;
        prev = p.t;
      }

      const wallTime = Math.max(0, latest - earliest);
      const wallOverCore = coreTime > 0 ? (wallTime / coreTime) : null;
      const avgConcurrentJobs = wallTime > 0 ? (coreTime / wallTime) : null;
      return { wallTime, coreTime, wallOverCore, avgConcurrentJobs, blockedOrQueued };
    }

    if (!trace) {
      // Show listing of recent traces from traces/index.json
      try {
        status.textContent = 'Loading trace index\u2026';
        const resp = await fetch('traces/index.json');
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const data = await resp.json();
        const traces = (data.traces || []).slice(0, 10);
        if (traces.length === 0) {
          status.textContent = 'No traces uploaded yet.';
          return;
        }
        status.textContent = 'Recent pipeline traces \u2014 click to open in Perfetto:';
        const table = document.createElement('table');
        table.innerHTML = '<thead><tr><th>Pipeline</th><th>Uploaded (local time)</th><th>Performance summary</th><th>Utilization (wall/core)</th><th>Blocked/queued (\u22641 running)</th></tr></thead>';
        const tbody = document.createElement('tbody');
        const analyses = await Promise.all(traces.map(async (t) => {
          try {
            const traceResp = await fetch(t.path);
            if (!traceResp.ok) throw new Error('HTTP ' + traceResp.status);
            const traceData = await traceResp.json();
            return analyzeTrace(traceData);
          } catch (_) {
            return null;
          }
        }));

        for (let i = 0; i < traces.length; i++) {
          const t = traces[i];
          const analysis = analyses[i];
          const tr = document.createElement('tr');
          const url = '?trace=' + encodeURIComponent(t.path);
          const label = t.pipeline_id || t.path.split('/').pop().replace('.json', '');
          const date = t.uploaded_at ? new Date(t.uploaded_at).toLocaleString() : 'unknown';
          const summary = analysis
            ? `${formatCoreTime(analysis.coreTime)} in ${formatDuration(analysis.wallTime)}`
            : 'n/a';
          const utilization = analysis
            && analysis.wallOverCore !== null
            && analysis.avgConcurrentJobs !== null
            ? `${analysis.wallOverCore.toFixed(2)} (avg ${analysis.avgConcurrentJobs.toFixed(2)} jobs)`
            : 'n/a';
          const blocked = analysis ? formatDuration(analysis.blockedOrQueued) : 'n/a';
          tr.innerHTML = '<td><a href="' + url + '">' + label + '</a></td>'
                       + '<td>' + date + '</td>'
                       + '<td>' + summary + '</td>'
                       + '<td>' + utilization + '</td>'
                       + '<td>' + blocked + '</td>';
          tbody.appendChild(tr);
        }
        table.appendChild(tbody);
        listing.appendChild(table);
        listing.hidden = false;
      } catch (err) {
        status.textContent = 'Error loading index: ' + err.message;
        status.className = 'error';
      }
      return;
    }

    // Launch a specific trace in Perfetto via postMessage
    try {
      status.textContent = 'Fetching ' + trace + '\u2026';
      const resp = await fetch(trace);
      if (!resp.ok) throw new Error('HTTP ' + resp.status + ' fetching ' + trace);
      const buffer = await resp.arrayBuffer();
      status.textContent = 'Opening Perfetto UI\u2026 (allow popups if prompted)';
      const win = window.open('https://ui.perfetto.dev');
      if (!win) {
        status.textContent = 'Popup was blocked. Allow popups for this site, then reload.';
        status.className = 'error';
        return;
      }
      const timer = setInterval(() => win.postMessage('PING', 'https://ui.perfetto.dev'), 50);
      window.addEventListener('message', (e) => {
        if (e.source !== win || e.data !== 'PONG') return;
        clearInterval(timer);
        win.postMessage(
          { perfetto: { buffer, title: trace, fileName: trace.split('/').pop() } },
          'https://ui.perfetto.dev'
        );
        status.textContent = 'Trace sent to Perfetto UI \u2014 check the new tab.';
        status.className = 'ok';
      });
    } catch (err) {
      status.textContent = 'Error: ' + err.message;
      status.className = 'error';
    }
  })();
  </script>
</body>
</html>
