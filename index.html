<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfetto Trace Launcher</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 4em auto; padding: 1em; }
    h1 { font-size: 1.5em; }
    #status { font-size: 1.1em; margin: 1em 0; }
    .error { color: #c00; }
    .ok { color: #060; }
    table { border-collapse: collapse; width: 100%; margin-top: 1em; }
    th, td { text-align: left; padding: 0.4em 0.7em; border-bottom: 1px solid #ddd; }
    th { background: #f5f5f5; font-weight: 600; }
    a { color: #0969da; }
    tr:hover td { background: #f8f8f8; }
  </style>
</head>
<body>
  <h1>EIC Perfetto Trace Launcher</h1>
  <p id="status">Initializing&hellip;</p>
  <div id="listing" hidden></div>
  <script>
  (async () => {
    const status = document.getElementById('status');
    const listing = document.getElementById('listing');
    const params = new URLSearchParams(location.search);
    const trace = params.get('trace');

    if (!trace) {
      // Show listing of recent traces from traces/index.json
      try {
        status.textContent = 'Loading trace index\u2026';
        const resp = await fetch('traces/index.json');
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const data = await resp.json();
        const traces = (data.traces || []).slice(0, 10);
        if (traces.length === 0) {
          status.textContent = 'No traces uploaded yet.';
          return;
        }
        status.textContent = 'Recent pipeline traces \u2014 click to open in Perfetto:';
        const table = document.createElement('table');
        table.innerHTML = '<thead><tr><th>Pipeline</th><th>EICWeb</th><th>Uploaded (local time)</th></tr></thead>';
        const tbody = document.createElement('tbody');
        for (const t of traces) {
          const tr = document.createElement('tr');
          const url = '?trace=' + encodeURIComponent(t.path);
          const label = t.pipeline_id || t.path.split('/').pop().replace('.json', '');
          const pipelineId = String(t.pipeline_id || '').trim();
          const safePipelineId = /^\d+$/.test(pipelineId) ? pipelineId : '';
          const eicwebUrl = safePipelineId
            ? 'https://eicweb.phy.anl.gov/EIC/benchmarks/detector_benchmarks/-/pipelines/' + safePipelineId
            : null;
          const date = t.uploaded_at ? new Date(t.uploaded_at).toLocaleString() : 'unknown';

          const pipelineCell = document.createElement('td');
          const pipelineLink = document.createElement('a');
          pipelineLink.href = url;
          pipelineLink.textContent = label;
          pipelineCell.appendChild(pipelineLink);

          const eicwebCell = document.createElement('td');
          if (eicwebUrl) {
            const eicwebLink = document.createElement('a');
            eicwebLink.href = eicwebUrl;
            eicwebLink.target = '_blank';
            eicwebLink.rel = 'noopener noreferrer';
            eicwebLink.textContent = 'Pipeline ' + safePipelineId;
            eicwebCell.appendChild(eicwebLink);
          } else {
            eicwebCell.textContent = '—';
          }

          const dateCell = document.createElement('td');
          dateCell.textContent = date;

          tr.appendChild(pipelineCell);
          tr.appendChild(eicwebCell);
          tr.appendChild(dateCell);
          tbody.appendChild(tr);
        }
        table.appendChild(tbody);
        listing.appendChild(table);
        listing.hidden = false;
      } catch (err) {
        status.textContent = 'Error loading index: ' + err.message;
        status.className = 'error';
      }
      return;
    }

    // Launch a specific trace in Perfetto via postMessage
    try {
      status.textContent = 'Fetching ' + trace + '\u2026';
      const resp = await fetch(trace);
      if (!resp.ok) throw new Error('HTTP ' + resp.status + ' fetching ' + trace);
      const buffer = await resp.arrayBuffer();
      status.textContent = 'Opening Perfetto UI\u2026 (allow popups if prompted)';
      const win = window.open('https://ui.perfetto.dev');
      if (!win) {
        status.textContent = 'Popup was blocked. Allow popups for this site, then reload.';
        status.className = 'error';
        return;
      }
      const timer = setInterval(() => win.postMessage('PING', 'https://ui.perfetto.dev'), 50);
      window.addEventListener('message', (e) => {
        if (e.source !== win || e.data !== 'PONG') return;
        clearInterval(timer);
        win.postMessage(
          { perfetto: { buffer, title: trace, fileName: trace.split('/').pop() } },
          'https://ui.perfetto.dev'
        );
        status.textContent = 'Trace sent to Perfetto UI \u2014 check the new tab.';
        status.className = 'ok';
      });
    } catch (err) {
      status.textContent = 'Error: ' + err.message;
      status.className = 'error';
    }
  })();
  </script>
</body>
</html>
